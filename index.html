<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<title>뉴스 대시보드</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#1f2430; --sub:#6b7280; --line:#e6e8ec;
    --hover:#f8f9fb; --divider:#f1f2f4; --box:#f8fafc; --boxline:#cbd5e1;
    --topbar:#111827; --topsub:#cbd5e1; --btn:#374151; --btnline:#4b5563; --btnhover:#4b5563;
    --fxbg:#fffbeb; --fxline:#fde68a; --fxink:#78350f; --fxlabel:#92400e;
    --church:#7c3aed; --canada:#dc2626; --korea:#0284c7; --world:#059669;
    --it:#ea580c; --community:#0d9488; --theology:#9333ea; --bible:#b45309; --fx:#ca8a04;
    --manna:#c2410c; --devlife:#15803d;
    --accent:#0284c7; --new:#dc2626;
  }
  html[data-theme="dark"]{
    --bg:#0f141c; --card:#1a212d; --ink:#e5e9f0; --sub:#94a3b8; --line:#2b3444;
    --hover:#232c3a; --divider:#252e3c; --box:#151c26; --boxline:#3a4657;
    --topbar:#070b11; --topsub:#94a3b8; --btn:#243044; --btnline:#36455c; --btnhover:#31405a;
    --fxbg:#2a2415; --fxline:#5c4c1d; --fxink:#fcd34d; --fxlabel:#d5a93a;
    --accent:#38bdf8; --new:#f87171;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Malgun Gothic",sans-serif;
    transition:background .2s,color .2s;}

  /* ---------- 상단바 ---------- */
  .topbar{position:sticky;top:0;z-index:30;background:var(--topbar);color:#fff;
    padding:12px 20px;box-shadow:0 2px 10px rgba(0,0,0,.2);}
  .topline{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 18px;}
  .dateblock{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;}
  .bigdate{font-family:"Nanum Myeongjo","Batangche","Batang",serif;
    font-size:clamp(24px,4vw,38px);font-weight:800;line-height:1.15;color:#fff;
    letter-spacing:-.01em;white-space:nowrap;}
  .subline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .pubdate{font-size:11px;color:var(--topsub);white-space:nowrap;}
  .pubdate b{color:#e5e7eb;font-weight:700;}
  .livestat{font-size:11px;color:#9ca3af;}
  .topbar h1.brand{font-size:14.5px;margin:0;display:flex;align-items:center;gap:6px;
    white-space:nowrap;color:#cbd5e1;font-weight:700;opacity:.9;}
  .topbar .meta{font-size:12.5px;color:var(--topsub);display:flex;gap:14px;flex-wrap:wrap;align-items:center;
    margin-left:auto;}
  .topbar .meta b{color:#fff;}
  .badge-unread{background:#dc2626;color:#fff;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;}
  .tools{display:flex;gap:7px;flex-wrap:wrap;align-items:center;width:100%;}
  .geo-tools{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
  .geo-grp{display:inline-flex;gap:5px;align-items:center;background:rgba(255,255,255,.06);
    border:1px solid var(--btnline);border-radius:9px;padding:3px 6px;}
  .geo-tag{font-size:11px;color:#cbd5e1;font-weight:700;white-space:nowrap;}
  .geo-x{padding:5px 8px !important;}
  .toolset{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
  .toolset.closed{display:none;}
  #toolsToggle{display:none;}
  .tbtn{background:var(--btn);color:#fff;border:1px solid var(--btnline);border-radius:8px;
    padding:6px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .tbtn:hover{background:var(--btnhover);}
  .tbtn.on{background:#2563eb;border-color:#3b82f6;}
  .tbtn:focus-visible{outline:2px solid #60a5fa;outline-offset:2px;}
  .searchbox{flex:1;min-width:170px;max-width:340px;}
  .searchbox input{width:100%;background:var(--btn);border:1px solid var(--btnline);border-radius:8px;
    color:#fff;padding:6px 11px;font-size:12.5px;font-family:inherit;}
  .searchbox input::placeholder{color:#9ca3af;}
  .searchbox input:focus{outline:2px solid #60a5fa;outline-offset:1px;}
  select.tbtn{appearance:none;padding-right:26px;
    background-image:linear-gradient(45deg,transparent 50%,#cbd5e1 50%),linear-gradient(135deg,#cbd5e1 50%,transparent 50%);
    background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  .archive-banner{background:#78350f;color:#fde68a;padding:8px 20px;font-size:12.5px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .archive-banner button{background:#fde68a;color:#78350f;border:none;border-radius:6px;
    padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}

  /* ---------- 레이아웃 ---------- */
  .wrap{width:100%;margin:0 auto;padding:18px 16px 60px;max-width:1900px;}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));align-items:start;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden;}
  .card h2{margin:0;padding:13px 15px;font-size:15px;display:flex;align-items:center;
    justify-content:space-between;gap:8px;color:#fff;cursor:pointer;user-select:none;}
  .card h2 .htitle{display:flex;align-items:center;gap:7px;min-width:0;}
  .card h2 .caret{font-size:11px;opacity:.85;transition:transform .2s;}
  .card.collapsed h2 .caret{transform:rotate(-90deg);}
  .card h2 .cnt{font-size:11px;font-weight:700;background:rgba(255,255,255,.22);
    border-radius:999px;padding:2px 9px;white-space:nowrap;}
  .grip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:#fff;
    border-radius:6px;padding:1px 6px;font-size:13px;line-height:1.3;cursor:grab;
    font-family:inherit;touch-action:none;flex:0 0 auto;}
  .grip:hover{background:rgba(255,255,255,.3);}
  .grip:active{cursor:grabbing;}
  .grip:focus-visible{outline:2px solid #fff;outline-offset:1px;}
  .card.dragging{position:fixed;z-index:80;pointer-events:none;
    box-shadow:0 14px 34px rgba(0,0,0,.3);transform:rotate(-1deg);opacity:.96;}
  .ph{border:2px dashed var(--boxline);border-radius:14px;background:transparent;}
  body.dragmode{cursor:grabbing;user-select:none;}
  .cat-church h2{background:var(--church);} .cat-canada h2{background:var(--canada);}
  .cat-korea h2{background:var(--korea);}   .cat-world h2{background:var(--world);}
  .cat-it h2{background:var(--it);}         .cat-community h2{background:var(--community);}
  .cat-theology h2{background:var(--theology);} .cat-bible h2{background:var(--bible);}
  .cat-devotion-manna h2{background:var(--manna);} .cat-devotion-life h2{background:var(--devlife);}
  /* 오늘의 묵상 박스 */
  .devo-today{margin:9px 12px 4px;padding:12px 13px;border-radius:12px;
    background:var(--box);border:1px solid var(--line);}
  .dv-head{font-size:11.5px;font-weight:800;color:var(--sub);letter-spacing:.02em;margin-bottom:8px;}
  .dv-block{padding:9px 0;}
  .dv-block + .dv-block{border-top:1px dashed var(--line);margin-top:2px;}
  .dv-name{font-size:11px;font-weight:800;color:var(--accent);margin-bottom:5px;letter-spacing:.01em;}
  .dv-theme{font-size:15px;font-weight:800;color:var(--ink);line-height:1.4;margin-bottom:8px;}
  .dv-row{display:flex;gap:8px;font-size:12.5px;line-height:1.6;padding:1px 0;}
  .dv-lb{flex:0 0 52px;color:var(--sub);font-weight:700;}
  .dv-vl{flex:1;color:var(--ink);}
  .dv-none{font-size:12.5px;color:var(--sub);line-height:1.6;margin:2px 0 4px;}
  .dv-link{display:inline-block;margin-top:9px;font-size:12px;font-weight:700;
    color:var(--accent);text-decoration:none;}
  .dv-link:hover{text-decoration:underline;}
  .cat-fx h2{background:var(--fx);}
  .card.collapsed .cardbody{display:none;}

  /* ---------- 뉴스 목록 (스크롤) ---------- */
  .list{list-style:none;margin:0;padding:4px 0;max-height:440px;overflow-y:auto;overscroll-behavior:contain;}
  .list::-webkit-scrollbar{width:8px;}
  .list::-webkit-scrollbar-thumb{background:var(--boxline);border-radius:4px;}
  .list::-webkit-scrollbar-track{background:transparent;}
  .item{display:flex;align-items:flex-start;gap:10px;padding:9px 15px;
    border-bottom:1px solid var(--divider);cursor:pointer;transition:background .15s;}
  .item:hover{background:var(--hover);}
  .item.read{opacity:.5;}
  .item .body{flex:1;min-width:0;}
  .item .ttl{font-size:13.4px;font-weight:600;line-height:1.45;}
  .item.open .ttl{color:var(--accent);}
  .item .tagrow{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap;}
  .item .tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;color:#fff;}
  .tag-ai{background:#7c3aed;} .tag-galaxy{background:#1d4ed8;} .tag-apple{background:#111827;}
  .tag-other{background:#64748b;}
  .item .date{font-size:11px;color:var(--sub);}
  .item .new{font-size:10px;font-weight:800;color:var(--new);}
  .chk-wrap{flex:0 0 auto;padding-top:2px;}
  .chk-wrap input{width:17px;height:17px;cursor:pointer;accent-color:#16a34a;}
  .divider-read{padding:6px 15px;font-size:10.5px;font-weight:700;color:var(--sub);
    background:var(--box);border-bottom:1px solid var(--divider);letter-spacing:.04em;}
  /* 지역 필터 바 */
  .geobar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;
    padding:9px 12px;background:var(--box);border-bottom:1px solid var(--divider);}
  .geosel{flex:1 1 auto;min-width:96px;max-width:100%;appearance:none;
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    color:var(--ink);font-family:inherit;font-size:12px;padding:5px 26px 5px 9px;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
    background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  .geosel:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .geoclear{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:8px;
    color:var(--sub);font-family:inherit;font-size:12px;padding:5px 9px;cursor:pointer;font-weight:700;}
  .geoclear:hover{background:var(--hover);}
  .morebtn{width:100%;background:none;border:none;border-top:1px solid var(--divider);
    padding:9px;font-size:11.5px;color:var(--sub);cursor:pointer;font-family:inherit;}
  .morebtn:hover{background:var(--hover);}

  /* ---------- 아코디언 요약 ---------- */
  .acc{background:var(--box);border-bottom:1px solid var(--divider);
    padding:0 15px;max-height:0;overflow:hidden;transition:max-height .28s ease,padding .28s ease;}
  .acc.open{max-height:640px;padding:12px 15px 13px;}
  .acc .s-body{font-size:12.9px;line-height:1.72;color:var(--ink);}
  .acc .s-en{margin-top:7px;font-size:11px;color:var(--sub);font-style:italic;opacity:.85;}
  .acc .s-meta{margin-top:8px;font-size:11.5px;color:var(--sub);}
  .acc .s-meta a{color:var(--accent);text-decoration:none;font-weight:600;}
  .acc .s-meta a:hover{text-decoration:underline;}
  .empty{padding:20px 15px;text-align:center;color:var(--sub);font-size:12.5px;}

  /* ---------- 환율 ---------- */
  .fx-grid{display:flex;flex-direction:column;gap:7px;padding:10px 12px 3px;}
  .fx-row{background:var(--fxbg);border:1px solid var(--fxline);border-radius:10px;padding:8px 10px;}
  .fx-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .fx-pair{font-size:10.5px;color:var(--fxlabel);font-weight:800;letter-spacing:.02em;}
  .swap{background:none;border:1px solid var(--fxline);color:var(--fxlabel);border-radius:6px;
    padding:1px 6px;font-size:10.5px;cursor:pointer;font-family:inherit;font-weight:700;}
  .swap:hover{background:var(--fxline);}
  .fx-val{font-size:15px;font-weight:800;color:var(--fxink);margin-top:1px;letter-spacing:-.01em;}
  .fx-chg{font-size:10.5px;margin-top:0;}
  .chg.up{color:#dc2626;} .chg.down{color:#0284c7;}
  html[data-theme="dark"] .chg.up{color:#f87171;} html[data-theme="dark"] .chg.down{color:#38bdf8;}
  .conv{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:6px;
    border-top:1px dashed var(--fxline);}
  .conv input{width:74px;background:var(--card);border:1px solid var(--fxline);border-radius:6px;
    padding:3px 6px;font-size:11.5px;color:var(--ink);font-family:inherit;text-align:right;}
  .conv .eq{font-size:11.5px;color:var(--fxlabel);font-weight:700;}
  .conv .out{font-size:12px;font-weight:800;color:var(--fxink);}
  .fx-note{padding:2px 12px 11px;font-size:10.3px;color:var(--sub);line-height:1.5;}
  .fx-note summary{cursor:pointer;font-weight:700;color:var(--fxlabel);list-style:none;}
  .fx-note summary::-webkit-details-marker{display:none;}
  .fx-note p{margin:5px 0 0;}

  /* ---------- 환율 통계 (요약 + 겹친 추이 그래프) ---------- */
  .fx-stat{margin:8px 12px 4px;padding:11px 12px 12px;background:var(--fxbg);
    border:1px solid var(--fxline);border-radius:12px;}
  .fx-sum{display:flex;flex-direction:column;gap:5px;}
  .fx-sum-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .fx-sum-l{font-size:12px;color:var(--fxink);}
  .fx-sum-l b{font-size:14.5px;font-weight:800;}
  .fx-sum-u{font-size:10.5px;color:var(--fxlabel);font-weight:700;margin-left:2px;}
  .fx-sum-c{font-size:11.5px;font-weight:800;white-space:nowrap;}
  .fx-rng{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap;}
  .fx-rng button{background:var(--card);border:1px solid var(--fxline);color:var(--fxlabel);
    border-radius:7px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
  .fx-rng button:hover{background:var(--fxline);}
  .fx-rng button.on{background:var(--fxlabel);border-color:var(--fxlabel);color:var(--card);}
  .fx-rng button:focus-visible{outline:2px solid var(--fxlabel);outline-offset:1px;}
  .fx-legend{display:flex;gap:12px;margin-top:9px;flex-wrap:wrap;font-size:10.5px;font-weight:700;}
  .fx-legend span{display:inline-flex;align-items:center;gap:5px;color:var(--fxink);}
  .fx-legend i{width:11px;height:11px;border:2px solid;border-radius:3px;display:inline-block;}
  .fx-plot{width:100%;height:118px;display:block;margin-top:6px;touch-action:none;cursor:crosshair;}
  .fx-plot .grid-l{stroke:var(--fxline);stroke-width:1;opacity:.7;}
  .fx-plot .axtx{fill:var(--fxlabel);font-size:9px;opacity:.9;}
  .fx-plot .ser{fill:none;stroke-width:1.6;}
  .fx-plot .cross{stroke:var(--fxlabel);stroke-width:1;stroke-dasharray:3 3;opacity:.55;}
  .fx-read{font-size:10.5px;color:var(--fxlabel);font-weight:700;min-height:14px;margin-top:3px;}
  .fx-plot-msg{font-size:10.5px;color:var(--sub);text-align:center;padding:22px 0;line-height:1.5;}
  .fx-note summary{cursor:pointer;font-weight:700;color:var(--fxlabel);list-style:none;}
  .fx-note summary::-webkit-details-marker{display:none;}
  .fx-note p{margin:5px 0 0;}

  /* ---------- 데이터 붙여넣기 (팝업) ---------- */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(15,20,28,.6);
    display:none;align-items:flex-start;justify-content:center;padding:34px 16px 24px;
    overflow-y:auto;backdrop-filter:blur(2px);}
  .modal.open{display:flex;}
  .sheet{background:var(--card);color:var(--ink);border:1px solid var(--line);
    border-radius:16px;width:100%;max-width:660px;max-height:calc(100vh - 58px);
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 18px 48px rgba(0,0,0,.34);}
  .sheet-head{padding:15px 20px 11px;border-bottom:1px solid var(--line);background:var(--box);}
  .sheet-head h3{margin:0;font-size:15.5px;display:flex;align-items:center;gap:7px;}
  .sheet-head p{margin:7px 0 0;font-size:12px;color:var(--sub);line-height:1.6;}
  .sheet-body{padding:14px 20px;overflow-y:auto;flex:1;}
  .sheet textarea{width:100%;height:min(46vh,300px);border:1px solid var(--line);border-radius:10px;
    padding:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
    line-height:1.55;background:var(--box);color:var(--ink);resize:vertical;}
  .sheet textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .sheet-foot{padding:11px 20px 15px;border-top:1px solid var(--line);background:var(--box);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .sheet button{border-radius:9px;padding:8px 15px;font-size:13px;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;}
  .sheet button:hover{background:var(--hover);}
  .sheet button.primary{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:700;}
  .sheet button.primary:hover{background:#1d4ed8;}
  .sheet button.ghost{margin-left:auto;}
  .sheet button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .msg{font-size:12.3px;font-weight:600;flex-basis:100%;}
  .msg.ok{color:#16a34a;} .msg.err{color:#dc2626;}

  @media (max-width:640px){
    .topbar{padding:10px 14px;}
    .topbar .meta{font-size:11.5px;gap:10px;margin-left:0;}
    .bigdate{font-size:clamp(20px,7vw,28px);}
    .topbar h1.brand{font-size:12.5px;}
    .wrap{padding:14px 11px 50px;}
    .grid{grid-template-columns:1fr;}
    /* 폰에서는 카드 안 목록을 전부 펼쳐 페이지 스크롤과 충돌하지 않게 함 */
    .list{max-height:none;overflow-y:visible;}
    /* 그립을 눌러 끌 때만 반응하고, 평소 세로 스크롤은 그대로 통과 */
    .grip{touch-action:pan-y;}
    /* 그래프 위에서도 세로 스크롤이 되도록(가로로 훑을 때만 값 표시) */
    .fx-plot{touch-action:pan-y;}
    /* 폰에서는 ⚙ 도구 버튼을 보이고, 도구 묶음은 접어 화면을 아낌 */
    #toolsToggle{display:inline-block;}
    .toolset{width:100%;margin-top:6px;}
    .geo-tools{width:100%;flex-direction:column;align-items:stretch;}
    .geo-grp{width:100%;flex-wrap:wrap;}
    .geo-grp .geosel{flex:1 1 30%;min-width:80px;}
    .searchbox{max-width:none;flex:1 1 60%;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topline">
    <div class="dateblock">
      <div class="bigdate" id="bigDate">-</div>
      <div class="subline">
        <span class="pubdate">발행 <b id="updatedAt">-</b></span>
        <span id="liveStat" class="livestat"></span>
      </div>
    </div>
    <h1 class="brand">📰 뉴스 대시보드</h1>
    <div class="meta">
      <span>미확인 <span class="badge-unread" id="totalUnread">0</span></span>
    </div>
    <div class="tools">
      <div class="searchbox"><input id="q" type="search" placeholder="제목·요약 검색…" autocomplete="off"></div>
      <button class="tbtn" id="toolsToggle" title="도구 열기/닫기" aria-expanded="true">⚙ 도구 ▾</button>
      <div class="toolset" id="toolset">
        <span id="geoTools" class="geo-tools"></span>
        <select class="tbtn" id="dateSel" title="날짜별 지난 뉴스"></select>
        <select class="tbtn" id="sortSel" title="정렬">

  summary:"삼성전자가 런던에서 갤럭시 언팩을 열고 갤럭시 Z 폴드8 울트라($2,100), Z 폴드8($1,900), Z 플립8과 함께 갤럭시 워치9($379), 워치 울트라2($699, 배터리 60시간)를 공개했다.",
  source:"IT 전문지 종합",url:""},
 {id:"it4",tag:"애플",title:"애플, 클라나 제휴 'Apple Upgrade' 아이폰 구독 프로그램 출시",date:"2026-07-25",
  summary:"애플이 클라나(Klarna)와 손잡고 월 $17.99부터 시작하는 24개월 약정형 아이폰 리스 프로그램 'Apple Upgrade'를 선보였다.",

 {id:"it5",tag:"애플",title:"iOS 26.6 배포, 보안 취약점 90여 건 패치",date:"2026-07-27",
  summary:"애플이 iOS 26.6을 배포하며 약 90건의 보안 취약점을 수정했다. 아이폰18 프로는 다이나믹 아일랜드 축소, 위성 5G 지원 등을 담아 9월 초 공개될 것이라는 전망이 나온다. 보안 패치 규모가 큰 만큼 업데이트를 미루지 않는 편이 좋다.",
  source:"IT 전문지 종합",url:""},

community: { title:"🧳 한인사회 · 이민 · 동포청", color:"community", items:[
 {id:"cm1",country:"캐나다",region:"전국",title:"캐나다, 부모·조부모 초청 이민 신청 잠정 중단",date:"2026-07-17",
  summary:"캐나다 이민부(IRCC)가 7월 17일 부모·조부모 초청(PGP) 신청 접수를 즉시 효력으로 잠정 중단한다고 발표했다. 가족 재결합 정책 기조에 상당한 변화를 뜻하는 조치로, 한국의 부모님을 모셔오려 준비하시던 이민 가정에는 직접적인 영향이 있다. 재개 시점은 아직 공지되지 않았으므로, 준비 중이신 분은 서류를 갖춰 두고 공식 발표를 주시하는 것이 좋다.",
  source:"IRCC / cic times",url:"https://ircc.com/news/ircc-updates-canada-immigration-processing-times-for-july-2026-cic-times"},
 {id:"cm2",country:"캐나다",region:"전국",title:"IRCC, 7월 처리기간 갱신… 임시체류 신청 대기 길어져",date:"2026-07-11",
  summary:"이민부가 7월 11일 각 비자·영주권 프로그램별 처리기간을 갱신해 발표했다. 특히 임시체류(방문·학생·취업) 신청자의 대기 시간이 전반적으로 길어진 것으로 나타났다. 방문비자로 부모님이나 친지를 초청할 계획이 있다면, 예상보다 넉넉히 시간을 두고 신청하시는 편이 안전하다.",
  source:"IRCC",url:"https://ircc.com/news/global-immigration-recap-june-2026-wr-immigration"},
 {id:"cm3",country:"한국",title:"재외동포청, '동포역량지원관' 신설… 협력센터 본청 통합",date:"2026-07-14",
  summary:"재외동포청(청장 김경협)이 7월 14일 「재외동포청 직제」 및 시행규칙을 공포하고 10월 1일부터 시행한다고 밝혔다. 핵심은 산하기관인 '재외동포협력센터'를 본청으로 통합하는 것으로, 흩어져 있던 재외동포 지원 체계를 하나로 합쳐 정책 수립과 사업 집행을 연계하고 행정의 효율성과 책임성을 높이겠다는 취지다. 한인회·한글학교 지원 창구가 단일화될 가능성이 있어 지역 단체들이 주목하고 있다.",
  source:"재외동포청",url:"https://www.oka.go.kr/"},
 {id:"cm4",country:"한국",title:"재외동포단체 지원사업 수요조사, 8월 3일 마감",date:"2026-07-29",
  summary:"재외동포청이 '2026년도 재외동포단체 지원사업 수요조사'를 실시하며 8월 3일까지 신청을 받는다. 2026년 8월부터 12월까지 재외공관 관할 지역에서 시행되는 동포 단체의 사업·행사가 대상이다. 신청은 재외동포 포털(www.korean.net)에서 하며, 마감 후에는 추가 신청이나 수정·보완이 불가능하다고 동포청은 강조했다. 한인 커뮤니티 행사를 준비 중인 단체라면 마감일을 놓치지 않도록 유의할 필요가 있다.",
  source:"미주 한국일보",url:"http://www.koreatimes.com/article/20260729/1623394"},
 {id:"cm5",country:"한국",title:"2026년 하반기, 재외동포·외국인 관련 제도 245가지 시행",date:"2026-07-01",
  summary:"2026년 하반기부터 재외동포와 외국인의 국내 생활에 직접 영향을 미치는 총 245가지 제도가 새로 시행되거나 확대된다. 재외동포 등록과 민원 서비스 개선, 재외동포 DB 구축, 청년 국내 정착·취업 지원 프로그램 등이 주요 내용이다. 정부는 DB 구축을 계획하고 있어 등록 절차를 밟아두면 향후 지원 정보를 정기적으로 받을 수 있다. 최종 확인은 각 부처의 공식 고시를 우선해야 한다.",
  source:"전국인력신문",url:"https://www.kjob.news/news/502009"},
 {id:"cm6",country:"캐나다",region:"전국",title:"캐나다 한인 26만 명, 세계 4위… 서부 한인 11만 명 시대",date:"2026-01-02",
  summary:"전 세계 재외동포 수는 줄었지만 캐나다 한인은 약 26만 명으로 세계 4위 규모를 유지하고 있다. 토론토의 성장세를 밴쿠버가 3배가량 앞지르며 서부 한인 사회가 11만 명 시대를 열었고, 유학생과 일반 체류자가 급증하며 한인 사회 전반에 활력이 돌고 있다는 분석이다. 대서양 연안 지역은 여전히 소규모지만, 전국 흐름 속에서 우리 위치를 가늠해 볼 수 있는 자료다.",
  source:"미주중앙일보",url:"https://www.koreadaily.com/article/20260102170045213"},
 {id:"cm7",country:"캐나다",region:"온타리오",city:"오타와",title:"캐나다 한인회 총연합회 회장단, 오타와 대사관 관저 방문",date:"2026-06-28",
  summary:"캐나다 한인회 총연합회(회장 이석로) 회장단이 오타와 주캐나다 대사관 관저를 방문해 한인 사회의 '새로운 도약'을 주제로 논의했다. 총연합회는 노바스코샤·뉴브런즈윅(몽튼)을 포함한 전국 20여 개 지역 한인회를 아우르는 조직이다.",
  source:"캐나다 한인회 총연합회",url:"https://fkca.ca/"},
 {id:"cm8",country:"한국",title:"국내 휴대전화 없이 '재외국민 인증' 가능… 해외번호·전자여권으로 즉시 발급",date:"2026-05-11",
  summary:"해외 번호와 전자여권만 있으면 즉시 인증서를 발급받을 수 있게 되어, 국세청 등 주요 공공 웹사이트 이용의 제약과 비용이 사라졌다. 한국 계좌·세무·연금 업무를 처리해야 하는 이민자에게 실질적인 도움이 되는 변화다.",
  source:"캐나다 한인회 총연합회",url:"https://fkca.ca/"},
 {id:"cm9",country:"캐나다",region:"온타리오",title:"온타리오, 기존 이민 스트림 폐지하고 'Workforce Priority Stream' 신설",date:"2026-06-26",
  summary:"온타리오주가 6월 26일자로 기존 OINP 8개 스트림을 모두 종료하고, 노동시장 수요에 맞춘 새로운 Workforce Priority Stream으로 전면 개편했다. 종료된 스트림으로는 더 이상 초청장이 발급되지 않는다. BC주도 별도 정원 상한을 둔 신규 등록 절차를 운영 중이어서, 주정부 이민을 준비하는 분들은 주별 규정을 새로 확인해야 한다.",
  source:"Immigration News Canada",url:"https://immigrationnewscanada.ca/new-canada-immigration-changes-july-2026/"},
]},

theology: { title:"📚 신학 · 서적", color:"theology", items:[
 {id:"th1",title:"부흥과개혁사, 신현우 저 신간 출간 (7월 15일)",date:"2026-07-15",
  summary:"개혁주의 신학서 전문 출판사 부흥과개혁사가 신현우 교수의 신간을 7월 15일 출간했다(신국판 양장, 216쪽). 같은 출판사는 낸시 도슨·유진 메릴·안드레아스 쾨스텐베르거의 『All the Genealogies of the Bible』 번역서도 준비 중이다. 성경 족보를 도표와 주해로 정리한 책으로, 창세기·역대상·마태복음 강해를 준비할 때 참고할 만하다.",
  source:"부흥과개혁사",url:"https://rnrbook.com/"},
 {id:"th2",title:"바빙크 『개혁교의학』, 한국 교회 신학 훈련의 표준으로",date:"2026-07-01",
  summary:"헤르만 바빙크의 『개혁교의학』이 개혁주의 교의학의 전형을 재현한 작품으로 한국 교회의 신학 훈련에 꾸준히 활용되고 있다. 조직신학 강의나 제직·소그룹 교재의 뼈대를 세울 때 참고 축으로 삼기 좋은 저작이다.",
  source:"부흥과개혁사",url:"https://rnrbook.com/"},
 {id:"th3",title:"『개혁주의 스터디 바이블』 — 66권 본문 해설과 교리 정리",date:"2026-07-01",
  summary:"종교개혁 500주년 기념작으로 발간된 『개혁주의 스터디 바이블』은 개혁주의 신학을 바탕으로 성경 66권의 중요 본문 해설과 교리를 함께 담고 있다. 성경공부 인도자용 참고서로 활용도가 높다.",
  source:"부흥과개혁사",url:"https://rnrbook.com/"},
]},
bible: { title:"📖 성경연구 · 고고학", color:"bible", items:[
 {id:"bb1",title:"이스라엘 고고학청, 사해사본 250점 첨단 분석 착수",date:"2026-07-09",
  summary:"이스라엘 고고학청(IAA)이 소장 중인 사해사본 약 250점을 대상으로 대규모 분석 연구를 시작했다. 화학 분석, 인공지능, 고문자학(paleography), 서지학(codicology)을 결합한 최신 기법이 동원된다. 본문비평과 정경 전승 논의에 새로운 자료가 더해질 가능성이 있어, 성경 본문의 전수 과정을 다루는 강의를 준비할 때 눈여겨볼 만한 소식이다.",
  source:"The Jerusalem Post",url:"https://www.jpost.com/tags/biblical-archaeology"},
 {id:"bb2",title:"제1성전기 '총독 관저'에서 마체바(기둥 석재) 발견",date:"2026-06-30",
  summary:"고고학자들이 '건물 101' 또는 '총독 관저'로 명명한 제1성전기 대형 주거지 내부에서 마체바(מַצֵּבָה, massebah)로 알려진 기둥 석재를 발굴했다. 마체바는 구약에서 예배·기념·경계 표지로 세워진 돌기둥을 가리키는 단어로, 창세기 28장 야곱의 벧엘 사건과 열왕기의 우상 개혁 본문을 함께 읽을 때 배경 이해에 도움이 된다.",
  source:"The Jerusalem Post",url:"https://www.jpost.com/tags/biblical-archaeology"},
 {id:"bb3",title:"실로 발굴 8차 시즌, 세 가지 발견 보고",date:"2026-06-24",
  summary:"성경의 실로(Shiloh) 유적 8차 발굴 시즌에서 세 가지 주요 발견이 보고됐다. 실로는 사사기와 사무엘상에서 이스라엘의 중심 예배 처소였고 성막이 자리했던 곳으로, 한나의 기도(삼상 1장)와 엘리 가문 이야기의 무대다.",
  source:"Bible Archaeology Report",url:"https://biblearchaeologyreport.com/"},
 {id:"bb4",title:"다윗성 기바티 주차장 발굴, 제1성전기 불탄 들보 출토",date:"2026-07-25",
  summary:"다윗성 기바티 주차장 발굴 현장에서 제1성전기의 불에 탄 무화과나무(sycamore) 들보가 발견됐다. 연구자들은 이것이 주전 586년 바벨론에 의해 파괴된 안뜰 지붕의 일부였을 것으로 본다. 예레미야애가와 열왕기하 25장의 예루살렘 함락 장면을 다룰 때 인용할 수 있는 구체적 물증이다.",
  source:"BiblePlaces Blog",url:"https://www.bibleplaces.com/blog/2026/07/weekend-roundup-part-1-307/"},
 {id:"bb5",title:"오벨 발굴 2026 시즌, 마무리 단계 진입",date:"2026-07-27",
  summary:"예루살렘 오벨(Ophel) 지역 2026년 발굴이 마무리 단계에 들어섰다는 현장 보고가 올라왔다. 오벨은 다윗성과 성전산 사이의 능선 지대로, 솔로몬 시대 왕궁·성벽 논쟁의 중심에 있는 구역이다.",
  source:"Armstrong Institute of Biblical Archaeology",url:"https://armstronginstitute.org/"},
 {id:"bb6",title:"'순례자의 길' 2026년 1월 일반 공개",date:"2026-01-01",
  summary:"기반시설 공사 중 발견된 예루살렘의 '순례자의 길(Pilgrim's Road)'이 2026년 1월부터 방문객에게 개방됐다. 500미터가 넘는 석회암 포장길로, 고고학자들은 이 길이 절기 때 실로암 못에서 성전산으로 올라가던 순례자들의 주 통로였다고 본다. 요한복음 9장 실로암 사건과 시편 120~134편 성전에 올라가는 노래를 함께 다룰 때 유용한 배경이다.",
  source:"Inspiration Travel",url:"https://www.inspirationtravel.com/blog/latest-archaeological-discoveries-israel"},
]},
},

try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); }catch(e){ _lsOK = false; }
function jget(k, fb){
  if(_lsOK){ try{ const v = localStorage.getItem(k); return v===null?fb:JSON.parse(v); }catch(e){} }

}

  _mem[k] = v;

}

/* ---- 데이터 적재 --------------------------------------------------- */
function dayOf(iso){ try{ return new Date(iso).toISOString().slice(0,10); }catch(e){ return String(iso).slice(0,10); } }
function allIds(d){ const out=[]; Object.values(d.news||{}).forEach(c=>(c.items||[]).forEach(i=>out.push(i.id))); return out; }

function bootData(){
  state.prefs  = Object.assign(state.prefs, jget(K.prefs, {}));
  state.read   = new Set(jget(K.read, []));
  state.seen   = new Set(jget(K.seen, []));
  state.newIds = new Set(jget(K.newids, []));
  state.archive= jget(K.arch, {});

  const saved = jget(K.data, null);
  let data = DEFAULT_DATA;
  if(saved && saved.updatedAt && new Date(saved.updatedAt) >= new Date(DEFAULT_DATA.updatedAt)) data = saved;

  /* 기본 데이터에 새로 생긴 섹션이 저장 데이터에는 없을 수 있다.
     저장 데이터에 없는 카테고리는 기본 데이터의 것을 채워 넣어, 새 섹션이 항상 보이게 한다. */
  if(data !== DEFAULT_DATA && data.news && DEFAULT_DATA.news){
    for(const k of Object.keys(DEFAULT_DATA.news)){
      if(!data.news[k]) data.news[k] = DEFAULT_DATA.news[k];
    }
  }
  state.data = data;

  /* 이 데이터셋을 처음 보는가? → 새 항목 계산 */
  if(jget(K.stamp,'') !== data.updatedAt){
    const ids = allIds(data);
    state.newIds = new Set(ids.filter(id => !state.seen.has(id)));
    ids.forEach(id => state.seen.add(id));
    const present = new Set(ids);
    state.read = new Set([...state.read].filter(id => present.has(id)));   /* 지난 회차 읽음표시 정리 */
    state.archive[dayOf(data.updatedAt)] = data;                            /* 날짜별 보관 */
    jset(K.stamp, data.updatedAt); jset(K.seen,[...state.seen]);
    jset(K.newids,[...state.newIds]); jset(K.read,[...state.read]);
    pruneArchive(); jset(K.arch, state.archive);
  }
  state.view = state.data;
  applyTheme(state.prefs.theme);
}

function pruneArchive(){          /* 최근 30개 날짜만 보관 */
  const keys = Object.keys(state.archive).sort().reverse();
  keys.slice(30).forEach(k => delete state.archive[k]);
}

/* 새 데이터 반영 */
function ingest(raw){
  if(!raw || !raw.news || !raw.updatedAt) throw new Error('updatedAt과 news 항목이 있어야 합니다.');
  state.archive[dayOf(state.data.updatedAt)] = state.data;   /* 지금 것을 보관함으로 */
  pruneArchive(); jset(K.arch, state.archive);
  jset(K.data, raw); jset(K.stamp, '');                       /* stamp 비워 새 항목 재계산 */
  try{ location.reload(); }catch(e){}
  /* reload가 막힌 환경(아티팩트)에서는 직접 재적재 */
  setTimeout(()=>{ if(document.getElementById('grid')){ bootData(); fillDates(); render(); } }, 60);
}

function fmtStamp(iso){
  try{
    return new Intl.DateTimeFormat('ko-KR',{timeZone:'America/Halifax',month:'long',day:'numeric',
      hour:'2-digit',minute:'2-digit',hour12:true}).format(new Date(iso)) + ' (Halifax)';
  }catch(e){ return iso; }
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function tagClass(t){ return t==='AI'?'ai':t==='갤럭시'?'galaxy':t==='애플'?'apple':'other'; }

function matches(it, q){
  if(!q) return true;
  const s = (it.title+' '+(it.summary||'')+' '+(it.source||'')).toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => s.includes(w));
}

/* ── 지역 필터 ──
   선택값(state.geo[key] = {country,region,city})으로 항목을 거른다.
   매칭: 항목에 country/region/city 필드가 있으면 그 값으로,
   없으면 제목+요약 텍스트에 지역명이 들어있는지로 판단한다. */
function itemText(it){ return (it.title||'') + ' ' + (it.summary||''); }
/* 지역 한 단계 매칭:
   - 항목에 해당 필드가 있으면 그 값과 일치해야 함
   - 없으면 본문 텍스트에 지역명이 들어있는지 확인
   - 상위(나라·주)는 그 아래 하위 지명이 본문에 있어도 통과시킨다 */
function geoNames(key, level, value){
  const tree = GEO_FOR[key]; const names = [value];
  if(!tree) return names;
  if(level==='country' && tree[value]){
    for(const region of Object.keys(tree[value])){
      names.push(region, ...(tree[value][region]||[]));
    }
  } else if(level==='region'){
    for(const country of Object.keys(tree)){
      if(tree[country][value]) names.push(...tree[country][value]);
    }
  }
  return names;
}
function geoHit(it, key, level, value){
  if(!value) return true;
  const fv = it[level];
  if(fv) return fv === value;                 /* 필드가 있으면 필드 우선 */
  const text = itemText(it);
  return geoNames(key, level, value).some(n => n && text.includes(n));
}
function geoPass(it, key){
  const sel = state.geo[key]; if(!sel) return true;
  if(sel.country && !geoHit(it,key,'country',sel.country)) return false;
  if(sel.region  && !geoHit(it,key,'region', sel.region))  return false;
  if(sel.city    && !geoHit(it,key,'city',   sel.city))    return false;
  return true;
}
/* 이 카테고리가 지역 필터 대상인가 — GEO_FOR에 정의돼 있으면 대상 */
function hasGeo(key){ return !!GEO_FOR[key]; }

function arrange(items, key){
  const live = state.viewDate === '';
  const q = document.getElementById('q').value.trim();
  let list = items.filter(it => matches(it, q));
  if(key) list = list.filter(it => geoPass(it, key));
  if(live && state.prefs.unreadOnly) list = list.filter(it => !state.read.has(it.id));

  const isRead = it => live && state.read.has(it.id);
  const isNew  = it => live && state.newIds.has(it.id) && !state.read.has(it.id);
  const byDate = (a,b) => String(b.date).localeCompare(String(a.date));

  const unread = list.filter(it => !isRead(it));
  const read   = list.filter(isRead);
  if(state.prefs.sort === 'new'){
    unread.sort((a,b)=> (isNew(b)?1:0)-(isNew(a)?1:0) || byDate(a,b));
  } else unread.sort(byDate);
  read.sort(byDate);
  return { unread, read, isRead, isNew };
}

function itemHtml(key, it, opts){
  const open = state.open[key] === it.id;
  const tag  = it.tag ? `<span class="tag tag-${tagClass(it.tag)}">${esc(it.tag)}</span>` : '';
  const nw   = opts.isNew(it) ? '<span class="new">NEW</span>' : '';
  return `
  <div class="item ${opts.isRead(it)?'read':''} ${open?'open':''}" data-cat="${key}" data-id="${esc(it.id)}">
    <div class="body">
      <div class="ttl">${esc(it.title)}</div>
      <div class="tagrow">${tag}<span class="date">${esc(it.date)}</span>${nw}</div>
    </div>
    <div class="chk-wrap">
      <input type="checkbox" ${opts.isRead(it)?'checked':''} title="읽음 표시"
             data-check="${esc(it.id)}" ${state.viewDate?'disabled':''}>
    </div>
  </div>
  <div class="acc ${open?'open':''}">
    <div class="s-body">${esc(it.summary||'')}</div>
    ${it.title_en?`<div class="s-en">원제: ${esc(it.title_en)}</div>`:''}
    <div class="s-meta">출처: ${esc(it.source||'-')}${it.url?` · <a href="${esc(it.url)}" target="_blank" rel="noopener">${isArticleUrl(it.url)?'기사 원문 보기':'매체 홈에서 찾기'} ↗</a>`:''}</div>
  </div>`;
}
/* URL이 개별 기사로 보이는가(경로가 충분히 깊거나 숫자 id 포함) vs 매체 홈 */
function isArticleUrl(u){
  try{
    const url = new URL(u);
    const path = url.pathname.replace(/\/+$/,'');
    if(!path || path === '') return false;                 /* 도메인만 */
    const segs = path.split('/').filter(Boolean);
    if(segs.length >= 2) return true;                       /* /news/canada/... 등 */
    if(/\d{4,}/.test(path)) return true;                    /* 기사 번호 포함 */
    if(url.search && /\d{3,}/.test(url.search)) return true;/* ?id=12345 등 */
    return false;
  }catch(e){ return false; }
}

/* ── 오늘의 묵상 자동 수집 ──
   오늘의 양식: odbkorea(한글)·odb.org(영어) RSS에서 그날 글을 읽는다.
   생명의 삶: 두란노 페이지를 EUC-KR로 해독해 본문·주제를 추출한다.
   모두 실패하면 아래 DEVO_SCHEDULE(수동 입력)과 링크로 넘어간다. */
const DEVO_READERS = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => u
];
function devoCache(){ return jget('nd_devo', {}); }
function devoCacheGet(k){
  const c = devoCache()[k];
  if(c && (Date.now()-c.t) < 6*60*60*1000) return c.v;   /* 6시간 */
  return null;
}
function devoCacheSet(k, v){
  const c = devoCache(); c[k] = { t:Date.now(), v };
  Object.keys(c).forEach(x => { if(Date.now()-c[x].t > 3*86400000) delete c[x]; });
  jset('nd_devo', c);
}
async function devoText(url, charset){
  let last;
  for(const mk of DEVO_READERS){
    try{
      const res = await fetch(mk(url), { signal: AbortSignal.timeout(14000) });
      if(!res.ok) throw new Error('HTTP '+res.status);
      if(charset){
        const buf = await res.arrayBuffer();
        return new TextDecoder(charset).decode(buf);
      }
      return await res.text();
    }catch(e){ last = e; }
  }
  throw last || new Error('요청 실패');
}
/* RSS에서 오늘(또는 최신) 글 하나 */
function pickFeedItem(xml, ymd){
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  if(doc.querySelector('parsererror')) throw new Error('xml 오류');
  const nodes = [...doc.querySelectorAll('item, entry')];
  if(!nodes.length) throw new Error('빈 피드');
  const get = (n, sel) => { const e = n.querySelector(sel); return e ? e.textContent : ''; };
  const dated = nodes.map(n => ({
    n,
    d: (()=>{ const t = Date.parse(get(n,'pubDate') || get(n,'published') || get(n,'updated')); 
              return isNaN(t) ? '' : new Date(t).toISOString().slice(0,10); })()
  }));
  return (dated.find(x => x.d === ymd) || dated[0]).n;
}
function stripTags(s){ const d = document.createElement('div'); d.innerHTML = s||''; return (d.textContent||'').replace(/\s+/g,' ').trim(); }

/* 오늘의 양식(한글) */
async function fetchMannaKo(ymd){
  const xml = await devoText("https://www.odbkorea.org/feed/");
  const item = pickFeedItem(xml, ymd);
  const g = sel => { const e = item.querySelector(sel); return e ? e.textContent : ''; };
  const theme = stripTags(g('title'));
  const body = stripTags(g('description') || g('content'));
  const mp = body.match(/오늘의\s*성경말씀\s*[:：]\s*([^\s].{0,40}?)(?=\s{2,}|\s[가-힣A-Z]{2,}\s|$)/);
  const rd = body.match(/성경읽기\s*[:：]\s*([^\n]{0,40}?)(?=\s{2,}|새찬송가|오늘의|$)/);
  const hy = body.match(/새찬송가\s*[:：]?\s*([0-9]{1,3}\s*\(?통?\s*[0-9]{0,3}\)?)/);
  return { theme, passage: mp ? mp[1].trim() : '', key:'', reading: rd?rd[1].trim():'', hymn: hy?('새찬송가 '+hy[1].trim()):'' };
}
/* Our Daily Bread(영어) */
async function fetchMannaEn(ymd){

/* 생명의 삶(두란노) — EUC-KR 페이지에서 본문·주제 추출 */
async function fetchLifeKo(ymd){
  const html = await devoText("https://www.duranno.com/qt/view/bible.asp?qtDate=" + ymd, 'euc-kr');
  const doc = new DOMParser().parseFromString(html, 'text/html');

async function loadDevotions(){
  const ymd = todayYmd();
  const jobs = [
    ['manna-ko', () => fetchMannaKo(ymd)],
    ['manna-en', () => fetchMannaEn(ymd)],
    ['life-ko',  () => fetchLifeKo(ymd)]
  ];
  let changed = false;
  for(const [k, fn] of jobs){
    const ck = ymd + '|' + k;
    if(state.devo[k] || devoCacheGet(ck)){
      if(!state.devo[k]) state.devo[k] = devoCacheGet(ck);
      continue;
    }
    if(state.devoLoad[k]) continue;
    state.devoLoad[k] = true;
    try{
      const v = await fn();
      if(v && (v.theme || v.passage)){ state.devo[k] = v; devoCacheSet(ck, v); changed = true; }
    }catch(e){ state.devoErr[k] = true; }
    state.devoLoad[k] = false;
  }
  if(changed) render();
}

/* ---- 환율 ---------------------------------------------------------- */
const PAIRS = [['USD','KRW','USD_KRW'],['CAD','KRW','CAD_KRW'],['USD','CAD','USD_CAD']];
function nfmt(v){
  if(!isFinite(v)) return '-';
  if(v >= 100) return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  if(v >= 1)   return v.toFixed(4);
  return v.toPrecision(5);
}
/* =====================================================================
   환율 통계 — 1일 / 3일 / 1주 / 1개월 겹친 추이 그래프
   세 통화쌍을 시작일=100 기준으로 정규화해 한 그래프에 겹쳐 그립니다.
   야후 파이낸스(일중 포함) → Frankfurter(ECB 일별) → 내장 샘플 순으로 시도.
   ===================================================================== */
const FX_RANGES = {
  '1d':{ label:'1일',  yr:'1d',  yi:'5m',  days:1  },
  '3d':{ label:'3일',  yr:'5d',  yi:'30m', days:3  },
  '1w':{ label:'1주',  yr:'5d',  yi:'60m', days:7  },
  '1m':{ label:'1개월', yr:'1mo', yi:'1d',  days:31 }
};
const FX_RANGE_KEYS = ['1d','3d','1w','1m'];
/* 그래프에 겹쳐 그릴 세 쌍 — 라벨과 색 */
const FX_SERIES = [
  { k:'USD_CAD', label:'USD→CAD', color:'#2563eb' },
  { k:'USD_KRW', label:'USD→KRW', color:'#dc2626' },
  { k:'CAD_KRW', label:'CAD→KRW', color:'#059669' }
];
const FX_YSYM = { USD_KRW:'USDKRW=X', CAD_KRW:'CADKRW=X', USD_CAD:'USDCAD=X' };
const FX_FCUR = { USD_KRW:['USD','KRW'], CAD_KRW:['CAD','KRW'], USD_CAD:['USD','CAD'] };
const FX_TTL  = 30*60*1000;
const FX_READERS = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => u
];

function fxsCache(){ return jget('nd_fxstat', {}); }
function fxsGet(k, r){
  const c = fxsCache()[k+'|'+r];
  if(c && Array.isArray(c.pts) && c.pts.length && (Date.now()-c.t) < FX_TTL) return c.pts;
  return null;
}
function fxsSet(k, r, pts, src){
  const c = fxsCache(); c[k+'|'+r] = { t:Date.now(), pts, src:src||'' };
  Object.keys(c).forEach(x => { if(Date.now()-c[x].t > 6*60*60*1000) delete c[x]; });
  jset('nd_fxstat', c);
}
async function fxGetJson(url){
  let last;
  for(const mk of FX_READERS){
    try{
      const res = await fetch(mk(url), { signal: AbortSignal.timeout(12000) });
      if(!res.ok) throw new Error('HTTP '+res.status);
      return JSON.parse(await res.text());
    }catch(e){ last = e; }
  }
  throw last || new Error('요청 실패');
}
function fxTrim(pts, r){
  if(!pts || pts.length < 2) return null;
  const cut = Date.now() - FX_RANGES[r].days*86400000;
  const win = pts.filter(p => p.ms >= cut);
  return win.length >= 2 ? win : pts.slice(-Math.min(pts.length, 8));
}
async function fxYahoo(k, r){
  const cfg = FX_RANGES[r], sym = FX_YSYM[k]; if(!sym) return null;
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?range=${cfg.yr}&interval=${cfg.yi}`;
  const j = await fxGetJson(url);
  const res = j?.chart?.result?.[0];
  const ts = res?.timestamp, cl = res?.indicators?.quote?.[0]?.close;
  if(!Array.isArray(ts) || !Array.isArray(cl)) throw new Error('형식 오류');
  const pts = [];
  for(let i=0;i<ts.length;i++){ if(cl[i]!=null && isFinite(cl[i])) pts.push({ ms:ts[i]*1000, v:cl[i] }); }
  return pts.length >= 2 ? pts : null;
}
async function fxFrank(k, r){
  const cur = FX_FCUR[k]; if(!cur) return null;
  const days = Math.max(FX_RANGES[r].days, 8);
  const from = new Date(Date.now() - days*86400000).toISOString().slice(0,10);
  const url = `https://api.frankfurter.dev/v1/${from}..?base=${cur[0]}&symbols=${cur[1]}`;
  const j = await fxGetJson(url);
  const rates = j?.rates; if(!rates) throw new Error('형식 오류');
  const pts = Object.keys(rates).sort().map(d => ({ ms:new Date(d+'T12:00:00Z').getTime(), v:rates[d][cur[1]] }))
                                       .filter(p => isFinite(p.v));
  return fxTrim(pts, r);
}
/* 내장 샘플: 현재 환율에서 역방향으로 완만한 곡선을 만들어 상대 추이를 흉내냄 */
function fxSample(k, r){
  const base = state.view.fx?.rates?.[k]; if(base==null) return null;
  const n = r==='1d'?26 : r==='3d'?24 : r==='1w'?28 : 30;
  const span = FX_RANGES[r].days*86400000;
  const seed = { USD_CAD:[-0.027], USD_KRW:[-0.0065], CAD_KRW:[0.0211] }[k] || [0];
  const drift = seed[0];                       /* 기간 총 변화율 근사 */
  const pts = [];
  for(let i=0;i<n;i++){
    const t = i/(n-1);
    const wobble = Math.sin(t*Math.PI*3 + (k.length)) * Math.abs(drift) * 0.28;
    const factor = 1 + drift*(1-t) + wobble*(1-t);
    pts.push({ ms: Date.now() - span*(1-t), v: base*factor });
  }
  return pts;
}
async function fxLoadStat(k, r){
  const id = k+'|'+r;
  if(state.fxsLoad[id]) return;
  state.fxsLoad[id] = true;
  let pts=null, src='';
  try{ pts = await fxYahoo(k, r); if(pts) src='야후 파이낸스'; }catch(e){}
  if(!pts){ try{ pts = await fxFrank(k, r); if(pts) src='ECB(Frankfurter)'; }catch(e){} }
  state.fxsLoad[id] = false;
  if(pts && pts.length>=2){ state.fxsData[id]=pts; state.fxsSrc[id]=src; fxsSet(k,r,pts,src); }
  else { const s=fxSample(k,r); if(s){ state.fxsData[id]=s; state.fxsSrc[id]='샘플'; } else state.fxsData[id]=null; }
  render();
}
function fxTick(ms, r){
  const d = new Date(ms), p = n=>String(n).padStart(2,'0');
  return (r==='1d'||r==='3d') ? `${p(d.getHours())}:${p(d.getMinutes())}` : `${d.getMonth()+1}/${d.getDate()}`;
}

/* 겹친 그래프 SVG — 각 시리즈를 시작값=100으로 정규화 */
function fxPlotSvg(r){
  const W=320, H=118, PL=30, PR=8, PT=8, PB=16;
  const series = FX_SERIES.map(s => {
    const raw = state.fxsData[s.k+'|'+r];
    if(!raw || raw.length<2) return null;
    const base = raw[0].v;
    return { ...s, pts: raw.map(p => ({ ms:p.ms, y:(p.v/base)*100 })) };
  }).filter(Boolean);
  if(!series.length) return null;

  const allY = series.flatMap(s => s.pts.map(p=>p.y));
  let mn=Math.min(...allY), mx=Math.max(...allY);
  const pad=(mx-mn)*0.15 || 0.5; mn-=pad; mx+=pad;
  const maxLen = Math.max(...series.map(s=>s.pts.length));
  const X = i => PL + i*(W-PL-PR)/((maxLen-1)||1);
  const Y = y => PT + (mx-y)/((mx-mn)||1)*(H-PT-PB);

  /* 가로 기준선(100 포함 3~4개) */
  let grid='';
  const ticks=[mn, (mn+mx)/2, mx]; const seen=new Set();
  [...ticks, 100].forEach(val=>{
    if(val<mn||val>mx) return; const key=val.toFixed(1); if(seen.has(key))return; seen.add(key);
    const y=Y(val).toFixed(1);
    grid += `<line class="grid-l" x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}"/>`
          + `<text class="axtx" x="2" y="${(+y+3).toFixed(1)}">${val.toFixed(0)}</text>`;
  });
  /* x축 라벨 양끝 */
  const anyPts = series[0].pts;
  const xax = `<text class="axtx" x="${PL}" y="${H-3}">${fxTick(anyPts[0].ms,r)}</text>`
            + `<text class="axtx" x="${W-PR}" y="${H-3}" text-anchor="end">${fxTick(anyPts[anyPts.length-1].ms,r)}</text>`;

  const paths = series.map(s=>{
    let d=''; s.pts.forEach((p,i)=>{ d += (i?'L':'M') + X(i).toFixed(1) + ',' + Y(p.y).toFixed(1) + ' '; });
    return `<path class="ser" d="${d.trim()}" stroke="${s.color}" vector-effect="non-scaling-stroke"/>`;
  }).join('');

  return `<svg class="fx-plot" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
      data-fxplot="${r}" data-w="${W}" data-pl="${PL}" data-pr="${PR}" data-len="${maxLen}"
      role="img" aria-label="${FX_RANGES[r].label} 환율 추이(시작일 100 기준)">
    ${grid}${xax}
    <line class="cross" x1="-9" y1="${PT}" x2="-9" y2="${H-PB}" vector-effect="non-scaling-stroke" style="display:none"/>
    ${paths}
  </svg>`;
}

function fxStatHtml(){

      ${chg?`<span class="fx-sum-c ${cls}">${arrow} ${esc(chg.replace(/[+\-]/,''))}</span>`:''}
    </div>`;
  }).join('');

  const btns = FX_RANGE_KEYS.map(x =>
    `<button class="${x===r?'on':''}" data-fxrng="${x}">${FX_RANGES[x].label}</button>`).join('');
  const legend = FX_SERIES.map(s =>
    `<span><i style="border-color:${s.color}"></i>${s.label}</span>`).join('');

  /* 그래프 — 세 쌍 모두 준비됐는지 확인, 없으면 로드 */
  let anyLoading=false, anyData=false;
  FX_SERIES.forEach(s=>{
    const id=s.k+'|'+r;
    if(!state.fxsData[id] && !fxsGet(s.k,r) && !state.fxsLoad[id]){ setTimeout(()=>fxLoadStat(s.k,r),0); anyLoading=true; }
    else { const c=fxsGet(s.k,r); if(c && !state.fxsData[id]){ state.fxsData[id]=c.pts; state.fxsSrc[id]=c.src; } }
    if(state.fxsData[id]) anyData=true;
    if(state.fxsLoad[id]) anyLoading=true;
  });

  let plot;
  const svg = anyData ? fxPlotSvg(r) : null;
  if(svg){
    const srcs = [...new Set(FX_SERIES.map(s=>state.fxsSrc[s.k+'|'+r]).filter(Boolean))];
    plot = svg + `<div class="fx-read" data-fxidle="${esc('시작일=100 기준 · 출처 '+(srcs.join('·')||'-'))}">시작일=100 기준 · 출처 ${esc(srcs.join('·')||'-')}</div>`;
  } else if(anyLoading){
    plot = `<div class="fx-plot-msg">추이를 불러오는 중…</div>`;
  } else {
    plot = `<div class="fx-plot-msg">추이 데이터를 불러오지 못했습니다.<br>인터넷 연결 또는 웹주소(https)에서 열었는지 확인해 주세요.</div>`;
  }

  return `<div class="fx-stat">
    <div class="fx-sum">${sum}</div>
    <div class="fx-rng">${btns}</div>
    <div class="fx-legend">${legend}</div>
    ${plot}
  </div>`;
}

function fxHtml(){
  const fx = state.view.fx; if(!fx) return '';
  const rows = PAIRS.map(([a,b,k])=>{
    const base = fx.rates?.[k]; if(base==null) return '';
    const inv = !!state.fxInv[k];
    const from = inv?b:a, to = inv?a:b;
    const rate = inv ? 1/base : base;
    const amt  = state.fxAmt[k] ?? 1;
    const chg  = inv ? '' : (fx.chg?.[k] || '');
    const dir  = inv ? '' : (fx.dir?.[k] || '');
    return `<div class="fx-row">
      <div class="fx-head">
        <span class="fx-pair">${from} → ${to}</span>
        <button class="swap" data-swap="${k}" title="방향 바꾸기">⇄ 방향</button>
      </div>
      <div class="fx-val">1 ${from} = ${nfmt(rate)} ${to}</div>
      ${chg?`<div class="fx-chg chg ${dir}">${esc(chg)}</div>`:''}
      <div class="conv">
        <input type="number" step="any" min="0" value="${amt}" data-amt="${k}" aria-label="${from} 금액">
        <span class="eq">${from} =</span>
        <span class="out">${nfmt(rate*Number(amt||0))} ${to}</span>
      </div>
    </div>`;
  }).join('');
  return `<div class="card cat-fx" data-key="fx">
    <h2 data-toggle="fx"><span class="htitle">
        <button class="grip" data-grip="fx" title="끌어서 위치 이동 (폰은 길게 눌러서, 키보드는 방향키)">⠿</button>
        <span class="caret">▼</span>💱 환율</span>
      <span class="cnt">양방향 · 계산기</span></h2>
    <div class="cardbody"><div class="fx-grid">${rows}</div>
      ${fxStatHtml()}
      <div class="fx-note"><details><summary>기준 ${esc(fx.updated||'-')} · 안내 보기</summary>
        <p>${esc(fx.note||'')}</p>
      </details></div></div>
  </div>`;
}

function orderedKeys(){
  const news = state.view.news || {};
  const all = ORDER.filter(k => news[k])
    .concat(Object.keys(news).filter(k => !ORDER.includes(k)));
  if(state.view.fx) all.push('fx');
  const saved = (state.prefs.order || []).filter(k => all.includes(k));
  return saved.concat(all.filter(k => !saved.includes(k)));
}
function saveOrder(){
  state.prefs.order = [...document.getElementById('grid').children]
    .map(el => el.dataset.key).filter(Boolean);
  jset(K.prefs, state.prefs);
}
function moveCard(key, step){
  const order = orderedKeys();
  const i = order.indexOf(key), j = i + step;
  if(i < 0 || j < 0 || j >= order.length) return;
  order.splice(j, 0, order.splice(i, 1)[0]);
  state.prefs.order = order; jset(K.prefs, state.prefs); render();
  const btn = document.querySelector(`[data-grip="${key}"]`); if(btn) btn.focus();
}

/* ---- 끌어서 옮기기 --------------------------------------------------- */
let drag = null;
function dragStart(e, key){
  const grid = document.getElementById('grid');
  const card = grid.querySelector(`.card[data-key="${key}"]`);
  if(!card) return;
  e.preventDefault();
  const r = card.getBoundingClientRect();
  const ph = document.createElement('div');
  ph.className = 'ph'; ph.style.height = r.height + 'px';
  card.parentNode.insertBefore(ph, card);
  Object.assign(card.style, {width:r.width+'px', height:r.height+'px',
                             left:r.left+'px', top:r.top+'px'});
  card.classList.add('dragging');
  document.body.classList.add('dragmode');
  drag = { card, ph, grid, ox:e.clientX - r.left, oy:e.clientY - r.top };
  window.addEventListener('pointermove', dragMove);
  window.addEventListener('pointerup', dragEnd);
  window.addEventListener('pointercancel', dragEnd);
}
function dragMove(e){
  if(!drag) return;
  drag.card.style.left = (e.clientX - drag.ox) + 'px';
  drag.card.style.top  = (e.clientY - drag.oy) + 'px';
  let over = null, rect = null;
  for(const c of drag.grid.querySelectorAll('.card:not(.dragging)')){
    const r = c.getBoundingClientRect();
    if(e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom){ over=c; rect=r; break; }
  }
  if(over){
    const gw = drag.grid.getBoundingClientRect().width;
    const oneCol = rect.width > gw * 0.9;          /* 좁은 화면 = 세로 한 줄 */
    const after = oneCol ? (e.clientY > rect.top + rect.height/2)
                         : (e.clientX > rect.left + rect.width/2);
    drag.grid.insertBefore(drag.ph, after ? over.nextSibling : over);
  }
}
function dragEnd(){
  if(!drag) return;
  const { card, ph, grid } = drag;
  window.removeEventListener('pointermove', dragMove);
  window.removeEventListener('pointerup', dragEnd);
  window.removeEventListener('pointercancel', dragEnd);
  card.classList.remove('dragging');
  card.removeAttribute('style');
  grid.insertBefore(card, ph); ph.remove();
  document.body.classList.remove('dragmode');
  drag = null;
  saveOrder(); render();
}

function bind(){
  const grid = document.getElementById('grid');
  grid.querySelectorAll('[data-grip]').forEach(el => {
    el.onclick = e => e.stopPropagation();
    el.onpointerdown = e => {
      e.stopPropagation();
      if(e.pointerType === 'mouse'){
        if(e.button === 0) dragStart(e, el.dataset.grip);
        return;
      }
      /* 터치·펜: 길게 눌러야(0.4초) 드래그 시작 → 그 전까지는 페이지 스크롤 가능 */
      const sx = e.clientX, sy = e.clientY;
      let holdTimer = setTimeout(() => {
        holdTimer = null;
        try{ navigator.vibrate && navigator.vibrate(15); }catch(_){}
        dragStart(e, el.dataset.grip);
      }, 400);
      const cancel = ev => {
        if(ev && ev.type === 'pointermove'){
          if(Math.abs(ev.clientX - sx) < 8 && Math.abs(ev.clientY - sy) < 8) return;
        }
        if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
        el.removeEventListener('pointermove', cancel);
        el.removeEventListener('pointerup', cancel);
        el.removeEventListener('pointercancel', cancel);
      };
      el.addEventListener('pointermove', cancel);
      el.addEventListener('pointerup', cancel);
      el.addEventListener('pointercancel', cancel);
    };
    el.onkeydown = e => {
      const step = (e.key==='ArrowLeft'||e.key==='ArrowUp') ? -1
                 : (e.key==='ArrowRight'||e.key==='ArrowDown') ? 1 : 0;
      if(step){ e.preventDefault(); e.stopPropagation(); moveCard(el.dataset.grip, step); }
    };
  });
  grid.querySelectorAll('[data-toggle]').forEach(el => el.onclick = () => {
    const k = el.dataset.toggle;
    state.prefs.collapsed[k] = !state.prefs.collapsed[k];
    jset(K.prefs, state.prefs); render();
  });
  grid.querySelectorAll('.item').forEach(el => el.onclick = e => {
    if(e.target.matches('input,a')) return;
    const k = el.dataset.cat, id = el.dataset.id;
    state.open[k] = (state.open[k] === id) ? null : id;
    render();
  });
  grid.querySelectorAll('[data-check]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    const id = el.dataset.check;
    if(el.checked) state.read.add(id); else state.read.delete(id);
    jset(K.read, [...state.read]); render();
  });
  grid.querySelectorAll('[data-more]').forEach(el => el.onclick = () => {
    const k = el.dataset.more; state.showAllRead[k] = !state.showAllRead[k]; render();
  });
  grid.querySelectorAll('[data-swap]').forEach(el => el.onclick = () => {
    const k = el.dataset.swap; state.fxInv[k] = !state.fxInv[k]; render();
  });
  grid.querySelectorAll('[data-amt]').forEach(el => el.oninput = () => {
    state.fxAmt[el.dataset.amt] = el.value;
    const row = el.closest('.fx-row'); const k = el.dataset.amt;
    const base = state.view.fx.rates[k]; const rate = state.fxInv[k] ? 1/base : base;
    const to = state.fxInv[k] ? PAIRS.find(p=>p[2]===k)[0] : PAIRS.find(p=>p[2]===k)[1];
    row.querySelector('.out').textContent = nfmt(rate*Number(el.value||0)) + ' ' + to;
  });

  /* 환율 통계 기간 버튼 */
  grid.querySelectorAll('[data-fxrng]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    state.fxStatRange = el.dataset.fxrng; render();
  });

  /* 겹친 그래프 위를 훑으면 그 시점의 세 값 표시 */
  grid.querySelectorAll('[data-fxplot]').forEach(svg => {
    const r = svg.dataset.fxplot;
    const readEl = svg.parentNode.querySelector('.fx-read');
    const line = svg.querySelector('.cross');
    const W=+svg.dataset.w, PL=+svg.dataset.pl, PR=+svg.dataset.pr, len=+svg.dataset.len;
    const move = ev => {
      const box = svg.getBoundingClientRect();
      const cx = (ev.touches?ev.touches[0].clientX:ev.clientX) - box.left;
      const t = Math.min(1, Math.max(0, (cx/box.width*W - PL)/(W-PL-PR)));
      const i = Math.round(t*(len-1));
      const parts = FX_SERIES.map(s=>{
        const raw = state.fxsData[s.k+'|'+r]; if(!raw) return null;
        const j = Math.min(raw.length-1, i);
        return `${FX_FCUR[s.k][0]}→${FX_FCUR[s.k][1]} ${nfmt(raw[j].v)}`;
      }).filter(Boolean);
      const raw0 = state.fxsData[FX_SERIES[0].k+'|'+r];
      const when = raw0 ? fxTick(raw0[Math.min(raw0.length-1,i)].ms, r) : '';
      if(readEl) readEl.textContent = when + ' · ' + parts.join(' / ');
      if(line){ const x=PL+t*(W-PL-PR); line.setAttribute('x1',x); line.setAttribute('x2',x); line.style.display=''; }
    };
    const leave = () => { if(readEl) readEl.textContent = readEl.dataset.fxidle||''; if(line) line.style.display='none'; };
    svg.onpointermove = move;
    svg.onpointerdown = e => { e.stopPropagation(); move(e); };
    svg.onpointerleave = leave;
    svg.onpointercancel = leave;
  });
}

   버튼 한 번으로 공개 RSS를 읽어 각 카테고리 최신 뉴스로 채웁니다.

/* 카테고리별 RSS 창구 (여러 개면 합쳐서 최신순으로) */
const FEEDS = {
  canada:    ["https://www.cbc.ca/webfeed/rss/rss-canada-newbrunswick"],
  korea:     ["https://www.yna.co.kr/rss/news.xml",
              "https://www.yna.co.kr/rss/economy.xml"],
  world:     ["https://www.cbc.ca/webfeed/rss/rss-world"],
  it:        ["https://www.theverge.com/rss/index.xml",
              "https://feeds.arstechnica.com/arstechnica/technology-lab"],
  bible:     ["https://www.jpost.com/rss/rssfeedsarchaeology.aspx"],
  church:    ["https://www.christianitytoday.com/feed/"],
  community: ["https://www.korean.net/rss/notice.xml"],
  theology:  [],   /* 안정적 공개 RSS 없음 → 큐레이션 유지 */
};

/* 항목 개수 상한(카테고리당) */
const FEED_MAX = 10;

/* CORS 우회 판독기들 — 순서대로 시도, 되는 것을 사용 */
const READERS = [
  u => "https://api.rss2json.com/v1/api.json?count=15&rss_url=" + encodeURIComponent(u),
  u => "https://api.allorigins.win/get?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
];

function stripHtml(s){
  const d = document.createElement('div'); d.innerHTML = s || '';
  let t = (d.textContent || '').replace(/\s+/g,' ').trim();
  return t;
}
function clip(s, n){ s = stripHtml(s); return s.length > n ? s.slice(0,n).trim() + '…' : s; }
function isoDate(s){
  const t = Date.parse(s); if(isNaN(t)) return new Date().toISOString().slice(0,10);
  return new Date(t).toISOString().slice(0,10);
}
function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
function hashId(prefix, s){
  let h = 5381; for(let i=0;i<s.length;i++) h = ((h<<5)+h) ^ s.charCodeAt(i);
  return prefix + '_' + (h>>>0).toString(36);
}

/* 한 판독기 응답을 표준 항목 배열로 */
function parseFeed(readerIndex, payload, feedUrl){
  const items = [];
  if(readerIndex === 0){                       /* rss2json: JSON */
    const j = typeof payload === 'string' ? JSON.parse(payload) : payload;
    if(j.status !== 'ok' || !Array.isArray(j.items)) throw new Error('rss2json fail');
    for(const it of j.items) items.push({
      title: stripHtml(it.title), date: isoDate(it.pubDate),
      summary: clip(it.description || it.content, 320),
      url: it.link || '', source: (j.feed && j.feed.title) || hostOf(feedUrl) });
    return items;
  }
  /* allorigins.get: {contents}, corsproxy: raw text → XML 파싱 */
  let xml = payload;
  if(readerIndex === 1){ const j = typeof payload==='string'?JSON.parse(payload):payload; xml = j.contents || ''; }
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  if(doc.querySelector('parsererror')) throw new Error('xml parse error');
  const nodes = doc.querySelectorAll('item, entry');
  nodes.forEach(n => {
    const g = sel => { const e = n.querySelector(sel); return e ? e.textContent : ''; };
    let link = g('link');
    const la = n.querySelector('link'); if(la && la.getAttribute('href')) link = la.getAttribute('href');
    items.push({
      title: stripHtml(g('title')),
      date: isoDate(g('pubDate') || g('published') || g('updated') || g('date')),
      summary: clip(g('description') || g('summary') || g('content'), 320),
      url: link || '', source: hostOf(feedUrl) });
  });
  return items;
}

/* 한 피드 가져오기: 판독기들을 차례로 시도 */
async function fetchFeed(feedUrl){
  let lastErr;
  for(let i=0;i<READERS.length;i++){
    try{
      const res = await fetch(READERS[i](feedUrl), { signal: AbortSignal.timeout(15000) });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const body = (i === 2) ? await res.text() : await res.text();
      const items = parseFeed(i, body, feedUrl);
      if(items.length) return items;
      throw new Error('빈 결과');
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('실패');
}

/* 카테고리 하나 채우기 */
/* 영문으로 들어오는 피드가 있는 카테고리 — 제목·요약을 한글로 번역 */
const ENGLISH_CATS = new Set(['canada','world','it','bible','church']);

/* 한글이 이미 상당히 섞여 있으면 번역 불필요 */
function looksKorean(s){
  const kor = (s.match(/[가-힣]/g)||[]).length;
  return kor >= Math.max(3, s.length*0.15);
}
/* 번역 전용 프록시 (RSS용 READERS를 쓰면 rss2json이 끼어들어 실패한다) */
const TR_READERS = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => u
];
/* 번역 결과 캐시 — 같은 문장을 다시 번역하지 않는다 */
function trCache(){ return jget('nd_tr', {}); }
function trGet(s){ const c = trCache(); return c[s] || null; }
function trSet(s, out){
  const c = trCache();
  const keys = Object.keys(c);
  if(keys.length > 800) keys.slice(0, 300).forEach(k => delete c[k]);   /* 오래된 것 정리 */
  c[s] = out; jset('nd_tr', c);
}

/* 무료 구글 번역(비공식) — 프록시 경유로 시도, 실패하면 원문 반환 */
async function translateToKo(text){
  if(!text || looksKorean(text)) return text;
  const cached = trGet(text);
  if(cached) return cached;
  const q = text.slice(0, 1500);
  const endpoints = [
    "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ko&dt=t&q=" + encodeURIComponent(q),
    "https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=auto&tl=ko&q=" + encodeURIComponent(q)
  ];
  for(const base of endpoints){
    for(const mk of TR_READERS){
      try{
        const res = await fetch(mk(base), { signal: AbortSignal.timeout(12000) });
        if(!res.ok) continue;
        let body = (await res.text()).trim();
        if(body.startsWith('{') && body.includes('"contents"')){
          try{ body = JSON.parse(body).contents; }catch(e){}
        }
        const j = JSON.parse(body);
        let out = '';
        if(Array.isArray(j) && Array.isArray(j[0])){
          out = j[0].map(seg => (Array.isArray(seg) ? seg[0] : seg)).filter(Boolean).join('');
        } else if(Array.isArray(j) && typeof j[0] === 'string'){
          out = j[0];
        }
        out = (out || '').trim();
        if(out && out !== text){ trSet(text, out); return out; }
      }catch(e){ /* 다음 시도 */ }
    }
  }
  return text;   /* 번역 실패 시 원문 유지 */
}
async function translateItems(items){
  for(const it of items){
    try{
      const t = await translateToKo(it.title);
      if(t && t !== it.title){ it.title_en = it.title; it.title = t; }
      const s = await translateToKo(it.summary);
      if(s && s !== it.summary){ it.summary_en = it.summary; it.summary = s; }
    }catch(e){}
  }
  return items;
}

/* 화면에 이미 올라온 영문 항목을 그 자리에서 번역 (새로고침 없이) */
let trBusy = false;
async function translateCurrentView(){
  if(trBusy) return;
  trBusy = true;
  const btn = document.getElementById('trBtn');
  if(btn){ btn.textContent = '⏳ 번역 중…'; btn.disabled = true; }
  let n = 0;
  for(const key of Object.keys(state.data.news || {})){
    const items = state.data.news[key].items || [];
    for(const it of items){
      if(looksKorean(it.title || '')) continue;
      const before = it.title;
      await translateItems([it]);
      if(it.title !== before) n++;
    }
    render();
  }
  jset(K.data, state.data);
  trBusy = false;
  if(btn){ btn.textContent = '🈯 영문 번역'; btn.disabled = false; }
  render();
  if(!n) alert('번역할 영문 항목이 없거나, 번역 서비스에 연결하지 못했습니다.\n웹주소(https)로 열었는지 확인해 주세요.');
}

async function fetchCategory(key){
  const urls = FEEDS[key] || [];
  if(!urls.length) return null;
  let all = [];
  for(const u of urls){
    try{ all = all.concat(await fetchFeed(u)); }catch(e){ /* 이 피드만 건너뜀 */ }
  }
  if(!all.length) return null;
  /* 중복 제거 + 최신순 + 상한 */
  const seen = new Set(); const uniq = [];
  all.sort((a,b)=> String(b.date).localeCompare(String(a.date)));
  for(const it of all){
    const k = it.title.toLowerCase(); if(seen.has(k) || !it.title) continue;
    seen.add(k); it.id = hashId(key, it.url || it.title); uniq.push(it);
    if(uniq.length >= FEED_MAX) break;
  }
  /* 영문 카테고리는 한글로 번역 */
  if(ENGLISH_CATS.has(key)) await translateItems(uniq);
  return uniq;
}

/* 전체 새로고침. silent=true면 실패해도 alert 없이 조용히 끝난다(자동 스케줄용) */
let liveBusy = false;
async function liveRefresh(silent){
  if(liveBusy) return;
  if(state.viewDate){ /* 보관본 보는 중이면 오늘로 */
    state.viewDate=''; state.view=state.data;
    document.getElementById('dateSel').value=''; render();
  }
  liveBusy = true;
  const btn = document.getElementById('liveBtn');
  const stat = document.getElementById('liveStat');
  if(!silent){ btn.textContent = '⏳ 불러오는 중…'; btn.disabled = true; }
  else { stat.textContent = '🔄 자동 갱신 중…'; }

  const keys = Object.keys(FEEDS).filter(k => (FEEDS[k]||[]).length);
  const results = await Promise.allSettled(keys.map(k => fetchCategory(k)));

  const fresh = JSON.parse(JSON.stringify(state.data));   /* 현재본 복제 */
  let okCount = 0, failNames = [];
  const LABEL = { canada:'캐나다', korea:'한국', world:'국제', it:'IT',
                  bible:'성경연구', church:'교계', community:'한인사회' };

  results.forEach((r, i) => {
    const key = keys[i];
    if(r.status === 'fulfilled' && r.value && r.value.length){
      if(fresh.news[key]){
        const cur = fresh.news[key];
        /* IT는 기존 태그 로직과 어울리도록 tag 기본값 부여 */
        if(key === 'it') r.value.forEach(it => { if(!it.tag) it.tag = 'other'; });
        fresh.news[key] = { title: cur.title, color: cur.color, items: r.value };
        okCount++;
      }
    } else {
      failNames.push(LABEL[key] || key);
    }
  });

  if(okCount === 0){
    if(!silent){ btn.textContent = '🔄 새로고침'; btn.disabled = false; }
    liveBusy = false;
    stat.textContent = '';
    if(!silent) alert('자동 새로고침에 실패했습니다.\n\n' +
      '· 인터넷 연결을 확인해 주세요.\n' +
      '· 컴퓨터·폰에 저장된 파일(file://)로 열면 보안상 막힐 수 있습니다.\n' +
      '  이때는 대시보드를 웹주소(https://…)에 올려두면 새로고침이 작동합니다.\n' +
      '  (그동안은 “⬇ 데이터 갱신”으로 채우실 수 있습니다.)');
    return;
  }

  fresh.updatedAt = new Date().toISOString();
  fresh.fx = state.data.fx;   /* 환율은 RSS 대상이 아니므로 기존 유지 */
  try{ localStorage.setItem('nd_livecache', JSON.stringify(fresh)); }catch(e){}
  ingest(fresh);              /* 저장 + 새 항목 계산 + 새로고침 */

  /* ingest가 reload하므로 아래는 실행되지 않지만, reload 실패 대비 */
  if(!silent){ btn.textContent = '🔄 새로고침'; btn.disabled = false; }
  liveBusy = false;
  if(failNames.length) stat.textContent = '(' + failNames.join('·') + ' 제외)';
}

function init(){
  bootData(); fillDates(); render();
  loadDevotions();          /* 오늘의 묵상 자동 수집 */

  document.getElementById('q').oninput = render;

  /* ⚙ 도구 열고 닫기 — 폰에서는 기본 접힘 */
  const toolset = document.getElementById('toolset');
  const toolsToggle = document.getElementById('toolsToggle');
  const isPhone = (window.matchMedia && window.matchMedia('(max-width:640px)').matches) || window.innerWidth <= 640;
  if(isPhone) toolset.classList.add('closed');
  const syncToolBtn = () => {
    const open = !toolset.classList.contains('closed');
    toolsToggle.textContent = open ? '⚙ 도구 ▴' : '⚙ 도구 ▾';
    toolsToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  };
  syncToolBtn();
  toolsToggle.onclick = () => { toolset.classList.toggle('closed'); syncToolBtn(); };
  document.getElementById('sortSel').value = state.prefs.sort;
  document.getElementById('sortSel').onchange = e => { state.prefs.sort = e.target.value; jset(K.prefs,state.prefs); render(); };
  document.getElementById('unreadBtn').onclick = () => { state.prefs.unreadOnly = !state.prefs.unreadOnly; jset(K.prefs,state.prefs); render(); };
  document.getElementById('themeBtn').onclick = () => {
    state.prefs.theme = state.prefs.theme==='dark' ? 'light' : 'dark';
    jset(K.prefs, state.prefs); applyTheme(state.prefs.theme);
  };
  document.getElementById('allReadBtn').onclick = () => {
    if(state.viewDate) return;
    allIds(state.data).forEach(id => state.read.add(id));
    jset(K.read,[...state.read]); render();
  };
  document.getElementById('resetBtn').onclick = () => {
    state.read.clear(); jset(K.read,[]); render();
  };
  document.getElementById('orderBtn').onclick = () => {
    delete state.prefs.order; jset(K.prefs, state.prefs); render();
  };
  document.getElementById('dateSel').onchange = e => {
    state.viewDate = e.target.value;
    state.view = state.viewDate ? state.archive[state.viewDate] : state.data;
    state.open = {}; render();
  };
  document.getElementById('archBack').onclick = () => {
    state.viewDate=''; state.view=state.data; state.open={};
    document.getElementById('dateSel').value=''; render();
  };

  /* 데이터 갱신 모달 */
  document.getElementById('liveBtn').onclick = () => liveRefresh(false);
  document.getElementById('trBtn').onclick = translateCurrentView;
  const modal = document.getElementById('modal'), msg = document.getElementById('dataMsg');
  const closeModal = () => { modal.classList.remove('open'); document.body.style.overflow=''; };
  document.getElementById('dataBtn').onclick = () => {
    msg.textContent=''; msg.className='msg';
    modal.classList.add('open'); document.body.style.overflow='hidden';
    modal.scrollTop = 0;
    setTimeout(()=>document.getElementById('dataIn').focus(), 40);
  };
  document.getElementById('closeModal').onclick = closeModal;
  modal.onclick = e => { if(e.target===modal) closeModal(); };
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && modal.classList.contains('open')) closeModal();
  });
  document.getElementById('copyCur').onclick = () => {
    const t = JSON.stringify(state.data, null, 1);
    navigator.clipboard?.writeText(t).then(
      ()=>{ msg.className='msg ok'; msg.textContent='현재 데이터를 복사했습니다.'; },
      ()=>{ document.getElementById('dataIn').value = t; msg.className='msg ok'; msg.textContent='아래 칸에 현재 데이터를 넣었습니다.'; });
  };
  document.getElementById('saveData').onclick = () => {
    try{
      let txt = document.getElementById('dataIn').value.trim();
      txt = txt.replace(/^```(json)?/,'').replace(/```$/,'').trim();
      const obj = JSON.parse(txt);
      if(!obj || !obj.updatedAt || !obj.news) throw new Error('updatedAt과 news 항목이 모두 있어야 합니다');
      if(!Object.keys(obj.news).length) throw new Error('news 안에 카테고리가 없습니다');
      msg.className='msg ok'; msg.textContent='저장했습니다. 새로고침합니다…';
      setTimeout(()=>ingest(obj), 400);
    }catch(err){
      msg.className='msg err';
      msg.textContent='읽을 수 없는 형식입니다 — JSON 전체를 그대로 붙여넣었는지 확인해 주세요. (' + err.message + ')';
    }
  };
}
init();

/* ── 날짜가 바뀌면 자동으로 새로고침 ──
   홈 화면 아이콘이나 브라우저가 어제 화면을 그대로 보여주는 경우(캐시·백그라운드 복귀)에
   대비해, 화면이 다시 보이거나 포커스를 받을 때마다 실제 오늘 날짜를 확인하고,
   페이지를 열었을 때와 날짜가 달라졌으면 최신 내용을 받아오도록 새로고침한다. */
(function(){
  let seenYmd = todayYmd();
  function checkDateAndReload(){
    const now = todayYmd();
    if(now !== seenYmd){
      seenYmd = now;
      try{ location.reload(); }catch(e){}
    }
  }
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') checkDateAndReload();
  });
  window.addEventListener('pageshow', (e) => {
    if(e.persisted) checkDateAndReload();   /* 브라우저 뒤로가기 캐시(bfcache)에서 복귀한 경우 */
  });
  window.addEventListener('focus', checkDateAndReload);
  setInterval(checkDateAndReload, 30*60*1000);   /* 화면을 계속 켜 두는 경우 대비, 30분마다 확인 */
})();

/* ── 하루 세 번(오전 7시·오후 1시·오후 6시) 뉴스 자동 갱신 ──
   정적 웹페이지라 화면이 완전히 꺼져 있을 때는 실행될 수 없다.
   대신 화면이 열려 있거나 다시 켜질 때마다 "오늘 이 시각대가 이미 지나갔는데
   아직 자동 갱신을 안 했다"를 확인해서, 그렇다면 조용히 새로고침한다.
   화면을 하루 중 한 번이라도 열어 보시면 그 시점까지 지난 시각대는 자동으로 채워진다. */
(function(){
  const SLOTS = [7, 13, 18];             /* 시(hour), Halifax 기준 */
  const K_SLOT = 'nd_auto_slot';         /* 마지막으로 자동 갱신한 "YYYY-MM-DD#슬롯인덱스" */

  function nowHalifax(){
    try{
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone:'America/Halifax', year:'numeric', month:'2-digit', day:'2-digit',
        hour:'2-digit', minute:'2-digit', hour12:false
      }).formatToParts(new Date());
      const g = t => parts.find(p=>p.type===t).value;
      return { ymd: `${g('year')}-${g('month')}-${g('day')}`, hour: +g('hour'), min: +g('minute') };
    }catch(e){
      const d = new Date();
      return { ymd: d.toISOString().slice(0,10), hour: d.getHours(), min: d.getMinutes() };
    }
  }
  /* 지금까지 지난 슬롯 중 가장 마지막 것의 인덱스(-1이면 아직 하나도 안 지남) */
  function lastPassedSlotIndex(hour, min){
    let idx = -1;
    for(let i=0;i<SLOTS.length;i++){ if(hour > SLOTS[i] || (hour===SLOTS[i] && min>=0)) idx = i; }
    return idx;
  }
  function checkScheduledRefresh(){
    if(liveBusy) return;
    const { ymd, hour, min } = nowHalifax();
    const idx = lastPassedSlotIndex(hour, min);
    if(idx < 0) return;                              /* 오늘 첫 시각대(7시) 전이면 아무 것도 안 함 */
    const marker = ymd + '#' + idx;
    if(jget(K_SLOT, '') === marker) return;           /* 이 시각대는 이미 갱신함 */
    jset(K_SLOT, marker);
    liveRefresh(true);                                 /* 조용히(알림 없이) 자동 갱신 */
  }
  /* 페이지를 열 때, 화면이 다시 보일 때, 포커스를 받을 때, 그리고 15분마다 확인 */
  setTimeout(checkScheduledRefresh, 3000);   /* 첫 로딩이 끝난 뒤 잠시 있다가 확인 */
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') checkScheduledRefresh();
  });
  window.addEventListener('focus', checkScheduledRefresh);
  setInterval(checkScheduledRefresh, 15*60*1000);
})();
</script>
